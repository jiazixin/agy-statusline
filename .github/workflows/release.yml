name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Actions are pinned by commit; the comment names the reviewed tag.
jobs:
  goreleaser:
    name: GoReleaser 发布
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # No build caches: release builds must not restore state from other runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - run: go vet ./...
      - run: go test -count=1 ./...
      - name: 核对 tag 与内置版本
        env:
          TAG: ${{ github.ref_name }}
        run: |
          go build -trimpath -o "$RUNNER_TEMP/agy-statusline" .
          got=$("$RUNNER_TEMP/agy-statusline" --version)
          want="agy-statusline $TAG (revision=$(git rev-parse HEAD | cut -c1-12))"
          if [ "$got" != "$want" ]; then
            printf 'version mismatch\n  got:  %s\n  want: %s\n' "$got" "$want" >&2
            exit 1
          fi
          echo "$got"
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.18.3
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
